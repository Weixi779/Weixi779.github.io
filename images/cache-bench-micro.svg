<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="微基准延迟对比">

  <style>
    /* light (default) — clear-water-navy-ish figure */
    .bg { fill: #F8FEFF; }
    .panel { fill: #FFFFFF; stroke: #C8E0E5; }
    .title { fill: #0D223B; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
    .subtitle { fill: #4E667A; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; }
    .title-sm { fill: #0D223B; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .tick { fill: #4E667A; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; }
    .legend { fill: #0D223B; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    .grid { stroke: #C8E0E5; stroke-width: 1; }
    .axis { stroke: #9BBBC6; stroke-width: 1.2; }
    .series-ref { stroke: #113056; }
    .series-idx { stroke: #0E8A7A; }
    .series-nsc { stroke: #C45C26; }
    .series-ref-dot { fill: #FFFFFF; stroke: #113056; stroke-width: 1.75; }
    .series-idx-dot { fill: #FFFFFF; stroke: #0E8A7A; stroke-width: 1.75; }
    .series-nsc-dot { fill: #FFFFFF; stroke: #C45C26; stroke-width: 1.75; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B1220; }
      .panel { fill: #121A2A; stroke: #2A3A4F; }
      .title { fill: #E8EEF6; }
      .subtitle { fill: #9AA8BA; }
      .title-sm { fill: #E8EEF6; }
      .tick { fill: #9AA8BA; }
      .legend { fill: #E8EEF6; }
      .grid { stroke: #243246; }
      .axis { stroke: #3A4D66; }
      .series-ref { stroke: #93C5FD; }
      .series-idx { stroke: #2DD4BF; }
      .series-nsc { stroke: #FB923C; }
      .series-ref-dot { fill: #121A2A; stroke: #93C5FD; }
      .series-idx-dot { fill: #121A2A; stroke: #2DD4BF; }
      .series-nsc-dot { fill: #121A2A; stroke: #FB923C; }
    }
  </style>
