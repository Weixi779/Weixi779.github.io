<title id="title">WICompress 1.4: two intentions, one policy pipeline</title>
<desc id="desc">Process enters WICompressOptions. Target passes through TargetValidator and TargetResolver and is translated back into the same options. Options and CompressionSolver converge on WritePlanResolver, WIWritePlan and WIImageEncoder. CompressionSolver also reaches the encoder. A separate input-support panel shows WIImageSource and WIImageInfo; their dependencies on planning and encoding are omitted from the main execution diagram.</desc>
