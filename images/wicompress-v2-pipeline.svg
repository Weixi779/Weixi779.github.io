<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">WICompress 2.0 final execution pipeline</title>
  <desc id="desc">Process and Target enter one request-scoped ImagePipeline. ImageIO and Rendering remain focused capabilities, while TargetSearch only provides candidate feedback.</desc>
  <style>
    .bg { fill: #F6F8FA; }
    .edge-label { fill: #59636E; font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .node text { font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .node .detail { font-size: 13px; font-weight: 450; }
    .request rect { fill: #F1EDFF; stroke: #6750A4; }
    .request text { fill: #2D1B4E; }
    .owner rect { fill: #FFF7E6; stroke: #C77700; }
    .owner text { fill: #5C3900; }
    .capability rect { fill: #EAF5FF; stroke: #1769AA; }
    .capability text { fill: #103B5D; }
    .value rect { fill: #EAF8F2; stroke: #147D64; }
    .value text { fill: #0B4437; }
    .node rect { stroke-width: 1.7; }
    .arrow { fill: none; stroke: #57606A; stroke-width: 1.8; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: #C77700; stroke-width: 1.7; stroke-dasharray: 7 6; marker-end: url(#owner-arrow); }
    .vocabulary { fill: none; stroke: #147D64; stroke-width: 1.5; stroke-dasharray: 5 5; marker-end: url(#value-arrow); }
    .arrow-fill { fill: #57606A; }
    .owner-fill { fill: #C77700; }
    .value-fill { fill: #147D64; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1117; }
      .edge-label { fill: #8B949E; }
      .request rect { fill: #251C3D; stroke: #A78BFA; }
      .request text { fill: #EDE9FE; }
      .owner rect { fill: #342810; stroke: #FBBF24; }
      .owner text { fill: #FEF3C7; }
      .capability rect { fill: #10283B; stroke: #60A5FA; }
      .capability text { fill: #DBEAFE; }
      .value rect { fill: #102E29; stroke: #34D399; }
      .value text { fill: #D1FAE5; }
      .arrow { stroke: #8B949E; }
      .feedback { stroke: #FBBF24; }
      .vocabulary { stroke: #34D399; }
      .arrow-fill { fill: #8B949E; }
      .owner-fill { fill: #FBBF24; }
      .value-fill { fill: #34D399; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-fill" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="owner-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="owner-fill" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="value-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="value-fill" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700" rx="16"/>
  <g transform="translate(0 -60)">

  <path class="arrow" d="M600 164 V188 H280 V220"/>
  <path class="arrow" d="M600 164 V188 H920 V220"/>
  <path class="arrow" d="M280 288 V330 H600 V350"/>
  <path class="arrow" d="M920 288 V330 H600 V350"/>
  <path class="arrow" d="M750 394 H850"/>
  <path class="feedback" d="M850 430 H780 V416 H750"/>
  <text class="edge-label" x="895" y="336">Target only</text>
  <path class="arrow" d="M600 438 V488 H285 V520"/>
  <path class="arrow" d="M600 438 V520"/>
  <path class="arrow" d="M600 438 V488 H915 V520"/>
  <path class="vocabulary" d="M285 710 V588"/>
  <path class="vocabulary" d="M430 676 H520 V588"/>
  <path class="vocabulary" d="M770 676 H680 V438"/>

  <g class="node request">
    <rect x="470" y="96" width="260" height="68" rx="12"/>
    <text x="600" y="130">WICompressor</text>
  </g>
  <g class="node request">
    <rect x="150" y="220" width="260" height="68" rx="12"/>
    <text x="280" y="246">WIImageProcess</text>
    <text class="detail" x="280" y="270">explicit intent</text>
  </g>
  <g class="node request">
    <rect x="790" y="220" width="260" height="68" rx="12"/>
    <text x="920" y="246">WICompressionTarget</text>
    <text class="detail" x="920" y="270">hard byte limit</text>
  </g>
  <g class="node owner">
    <rect x="450" y="350" width="300" height="88" rx="12"/>
    <text x="600" y="382">ImagePipeline</text>
    <text class="detail" x="600" y="410">request-scoped owner</text>
  </g>
  <g class="node owner">
    <rect x="850" y="350" width="260" height="88" rx="12"/>
    <text x="980" y="382">TargetSearch</text>
    <text class="detail" x="980" y="410">candidate feedback</text>
  </g>
  <g class="node capability">
    <rect x="155" y="520" width="260" height="88" rx="12"/>
    <text x="285" y="550">WIImageIO</text>
    <text class="detail" x="285" y="578">inspect · decode · transcode · encode</text>
  </g>
  <g class="node capability">
    <rect x="470" y="520" width="260" height="88" rx="12"/>
    <text x="600" y="550">WIImageRendering</text>
    <text class="detail" x="600" y="578">crop · resize · canvas · color space</text>
  </g>
  <g class="node value">
    <rect x="785" y="520" width="260" height="88" rx="12"/>
    <text x="915" y="550">WIResult</text>
    <text class="detail" x="915" y="578">Data · format · pixel size</text>
  </g>
  <g class="node value">
    <rect x="140" y="660" width="290" height="68" rx="12"/>
    <text x="285" y="686">WIImageDomain</text>
    <text class="detail" x="285" y="710">shared image facts</text>
  </g>
  <g class="node value">
    <rect x="770" y="660" width="290" height="68" rx="12"/>
    <text x="915" y="686">WICompressDomain</text>
    <text class="detail" x="915" y="710">Process · Target · Output</text>
  </g>
  </g>
</svg>
