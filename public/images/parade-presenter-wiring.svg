<svg xmlns="http://www.w3.org/2000/svg" width="560" height="734" viewBox="0 0 560 734" role="img" aria-labelledby="title desc">
<title id="title">Collection composition and type erasure</title>
<desc id="desc">CollectionOrchestrator composes concrete Section A and Section B through the SectionController protocol, indexing their identities as AnyHashable. Each section captures content containing AnyCellPresenter wrappers. Each wrapper stores an AnyHashable item identity and retains a concrete presenter. Presenter A configures and binds Cell A; Presenter B configures and binds Cell B. Each section can contain multiple presenter types. This diagram shows composition and type relationships, not the UIKit update pipeline.</desc>
