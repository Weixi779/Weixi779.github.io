:root { --ink:#343a40; --muted:#686f77; --paper:#fafaf8; --box:#fff; --wrap:#edf3f8; }
@media (prefers-color-scheme:dark) { :root { --ink:#e7eff8; --muted:#a9bad1; --paper:#101c32; --box:#192b44; --wrap:#223e56; } }
@font-face { font-family:WiringHand; src:url(data:font/woff2;base64,) format('woff2'); }
text { font-family:WiringHand,'Kaiti SC',serif; font-size:22px; fill:var(--ink); }
.small { font-size:18px; fill:var(--muted); }
.note { font-size:18px; fill:var(--muted); }
.sketch,.arrow { stroke:var(--ink); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.arrow { fill:none; }
</style>
