<title id="title">WICompress 2.0: modules moved, ownership remained</title>
<desc id="desc">Main execution paths during the transition. ProcessResolver and TargetResolver feed OutputResolver and WIExecutionPlan before ImagePipeline. Target also enters CompressionSolver, which feeds back to TargetResolver and still participates in execution through ImagePipeline. ImagePipeline uses the extracted WIImageIO.Source and WIImageRaster. Auxiliary resolver-to-plan inputs are omitted. WIImageSource is shown separately as pipeline input support.</desc>
<style>
:root { --ink:#343a40; --muted:#686f77; --paper:#fafaf8; --box:#fff; --connector:#686f77; }
@media (prefers-color-scheme:dark) { :root { --ink:#e7eff8; --muted:#a9bad1; --paper:#101c32; --box:#203550; --connector:#a9bad1; } }
@font-face { font-family:PipelineHand; src:url(data:font/woff2;base64,) format('woff2'); }
text { font-family:PipelineHand,serif; font-size:23px; fill:var(--ink); }
.small { font-size:18px; fill:var(--muted); }
.line { stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.retrace { fill:none; opacity:.3; stroke-width:1; }
.arrow { fill:none; stroke:var(--connector); stroke-width:1.3; }
.feedback { stroke:var(--connector); stroke-dasharray:6 5; }
</style>

