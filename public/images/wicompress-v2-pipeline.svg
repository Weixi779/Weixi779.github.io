<title id="title">WICompress 2.0: one orchestrator, focused capabilities</title>
<desc id="desc">Process and Target enter the request-scoped ImagePipeline. The pipeline calls ImageIO and Rendering and returns WIResult. Only Target requests use TargetSearch; its dashed return arrow denotes candidate feedback. A separate reference panel lists shared Domain vocabulary and its consumers, without implying execution order.</desc>
